name: "Setup Node.js and dependencies"
description: "Set up Node.js with npm caching and install dependencies from the lockfile"

inputs:
  node-version:
    description: "Node.js version. Defaults to lts/*, which resolves to the latest Node LTS at run time."
    required: false
    default: "lts/*"

runs:
  using: "composite"
  steps:
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: 🔎 Report toolchain
      shell: bash
      run: |
        echo "node $(node --version)"
        echo "npm  $(npm --version)"

    - name: 📦 Install dependencies
      shell: bash
      run: npm ci
